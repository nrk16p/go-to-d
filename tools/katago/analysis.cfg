# Config for `katago analysis`, used by tools/katago.ts and tools/check-book.ts.
# Adapted from KataGo's analysis_example.cfg (KataGo is MIT licensed, see LICENSES/KataGo.txt;
# https://github.com/lightvector/KataGo).
#
# What matters for this repo:
#  - reportAnalysisWinratesAs: tools/katago.ts reads this line to know whose view the numbers are in
#    and converts everything to the view of the player to move, so any of the three values works.

# No log files. KataGo still prints its start-up messages on stderr, which katago.ts keeps for error reports.
# logDir = analysis_logs

# BLACK = every winrate and score is from Black's side, whoever is to move.
reportAnalysisWinratesAs = BLACK

# The book check wants the value of the best move, not wide exploration (KataGo's analysis default is 0.04).
wideRootNoise = 0

# Used when a query does not say; tools/katago-protocol.ts always sends its own maxVisits (400 by default).
maxVisits = 400

# Measured on an Apple M2 (Metal): the GPU is the limit, so the split below only moved the time for 24 queries
# of 400 visits between 86 s (8 x 4) and 102 s (24 x 1). Many positions in parallel, few threads on each.
numAnalysisThreads = 8
numSearchThreadsPerAnalysisThread = 4
nnMaxBatchSize = 64
nnCacheSizePowerOfTwo = 23
nnMutexPoolSizePowerOfTwo = 17
nnRandomize = true
